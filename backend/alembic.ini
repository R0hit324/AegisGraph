# Alembic configuration for AegisGraph.
# The database URL is deliberately taken from the DATABASE_URL environment
# variable (migrations/env.py) — no credentials live in this file.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
version_path_separator = os
timezone = UTC

# ---- Logging (standard Python logging config) ----
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

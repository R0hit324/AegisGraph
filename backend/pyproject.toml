[project]
name = "aegisgraph-backend"
version = "0.1.0"
description = "AegisGraph backend (Phase 1 foundation)"
requires-python = ">=3.12"

# Runtime dependency pins intentionally live in requirements.txt so that a
# single source of truth is used by pip and Docker.

[tool.ruff]
line-length = 100
target-version = "py312"
output-format = "concise"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "S",   # flake8-bandit (security)
    "BLE", # blind except
    "SIM", # flake8-simplify
    "PTH", # use pathlib
    "A",   # builtin shadowing
    "C4",  # comprehensions
    "RET", # return rules
]
ignore = [
    "E501", # line length is handled by ruff format (line-length above)
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's `Depends(...)` is intentionally used in argument defaults.
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use asserts and wide fixtures.
"tests/*" = ["S101", "S105", "S106"]
# SQLite defaults exist for test-harness ergonomics only.
"app/database/session.py" = ["S104"]

[tool.ruff.lint.isort]
known-first-party = ["app", "migrations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:alembic.*",
]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
plugins = []
exclude = ["migrations/versions"]

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_missing_imports = true
